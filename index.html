<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <meta name="description" content="Explore 18 practical Solace Agent Mesh examples across six industries, with plain-language explanations and questions to start a customer conversation.">
  <title>Solace Agent Mesh | Conversation cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/solace-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css?v=8">

<body>
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <a class="brand" id="home-button" href="#" aria-label="Solace Agent Mesh — all industries">

    <a class="back-button" id="back-button" href="#" hidden>

      <div class="detail-heading">
        <h1 id="detail-title" tabindex="-1">Industry</h1>
      </div>
      <div class="detail-list" id="detail-list"></div>
