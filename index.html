<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#ffffff">
  <meta name="description" content="Solace Agent Mesh sales cheat sheet with three agent patterns for six industries.">
  <title>Solace Agent Mesh Sales Cards</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="assets/solace-logo.svg" type="image/svg+xml">
  <link rel="stylesheet" href="styles.css">
  <script src="app.js" defer></script>
</head>
<body>
  <header class="site-header">
    <button class="brand" id="home-button" type="button" aria-label="Show all industries">
      <img src="assets/solace-logo.svg" alt="Solace" width="86" height="22">
      <span>Agent Mesh</span>
    </button>
    <p>Sales cheat sheet</p>
    <button class="back-button" id="back-button" type="button" hidden>
      <span aria-hidden="true">←</span> Industries
    </button>
  </header>

  <main>
    <section class="screen active" id="industry-screen" aria-labelledby="industry-title">
      <div class="screen-heading">
        <p class="eyebrow">Solace Agent Mesh</p>
        <h1 id="industry-title">Choose an industry</h1>
      </div>
      <div class="industry-grid" id="industry-grid"></div>
    </section>

    <section class="screen" id="cards-screen" aria-labelledby="cards-title" hidden>
      <div class="screen-heading">
        <p class="eyebrow" id="cards-eyebrow">Industry</p>
        <h1 id="cards-title">Three agent patterns</h1>
      </div>
      <div class="case-grid" id="case-grid"></div>
    </section>
  </main>

  <footer>
    <p>Pattern → Decision → Action → Human gate</p>
  </footer>

  <dialog id="case-dialog" aria-labelledby="dialog-title">
    <div class="dialog-panel">
      <button class="dialog-close" type="button" aria-label="Close">×</button>
      <div id="dialog-content"></div>
    </div>
  </dialog>
</body>
</html>
